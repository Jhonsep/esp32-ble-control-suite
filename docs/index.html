<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <title>ESP32 BLE Control Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body.theme-light {
      --bg-main: #e2e8f0;
      --bg-card: #ffffff;
      --bg-surface: #e2e8f0;
      --bg-btn: #f1f5f9;
      --bg-pad: #e0f2fe;
      --border-pad: #0284c7;
      --text-main: #0f172a;
      --text-muted: #334155;
      --border-col: #94a3b8;
      --accent-blue: #0369a1;
      --accent-green: #047857;
      --accent-red: #be123c;
      --bg-console: #f8fafc;
    }
    body.theme-dark {
      --bg-main: #090d16;
      --bg-card: #111827;
      --bg-surface: #1e293b;
      --bg-btn: #1e293b;
      --bg-pad: rgba(14, 165, 233, 0.16);
      --border-pad: rgba(56, 189, 248, 0.5);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-col: #334155;
      --accent-blue: #38bdf8;
      --accent-green: #34d399;
      --accent-red: #fb7185;
      --bg-console: #090d16;
    }
  </style>
</head>
<body class="theme-dark bg-[var(--bg-main)] text-[var(--text-main)] antialiased p-2.5 sm:p-5 select-none transition-colors duration-200">
  <div class="max-w-md mx-auto bg-[var(--bg-card)] border border-[var(--border-col)] rounded-3xl shadow-xl overflow-hidden flex flex-col relative">
    
    <!-- Top Bar: Connection Status, Quick Connect, BLE Scanner | Dark Mode Toggle -->
    <div class="p-3 border-b border-[var(--border-col)] bg-[var(--bg-surface)] flex items-center justify-between gap-2">
      <!-- Left: Current Device & Status -->
      <button onclick="scanBleDevice()" class="flex items-center gap-2 text-left group hover:opacity-90 transition min-w-0 flex-1">
        <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-rose-500 shrink-0"></span>
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-1.5">
            <span class="font-bold text-sm truncate" id="deviceName">Sin conectar</span>
            <span class="text-[11px] px-1.5 py-0.5 rounded-md bg-rose-500/20 text-[var(--accent-red)] font-bold shrink-0" id="statusBadge">Off</span>
          </div>
          <p class="text-[11px] text-[var(--text-muted)] truncate" id="deviceHint">Toca ⚡ o 📡 para conectar</p>
        </div>
      </button>

      <!-- Right: Quick Reconnect + BLE Search | Separator | Night Mode Toggle -->
      <div class="flex items-center gap-1.5 shrink-0">
        <button onclick="quickReconnect()" id="quickConnBtn" title="Conexión rápida al último ESP32" class="px-2.5 py-1.5 rounded-xl text-xs font-bold border border-emerald-500/50 bg-emerald-500/15 text-[var(--accent-green)] hover:opacity-90 active:scale-95 transition flex items-center gap-1">
          <span>⚡</span>
          <span>Rápida</span>
        </button>

        <button onclick="scanBleDevice()" title="Buscar dispositivo BLE" class="px-2.5 py-1.5 rounded-xl text-xs font-bold border border-[var(--border-col)] bg-[var(--bg-card)] text-[var(--accent-blue)] hover:border-sky-500 active:scale-95 transition flex items-center gap-1">
          <span>📡</span>
          <span>BLE</span>
        </button>

        <!-- Vertical Separator -->
        <div class="h-6 w-[1px] bg-[var(--border-col)] mx-0.5"></div>

        <!-- Far-Right: Dark/Light Mode Button -->
        <button onclick="toggleTheme()" id="themeBtn" title="Activar / Desactivar Modo Oscuro" class="p-1.5 rounded-xl border border-[var(--border-col)] bg-[var(--bg-card)] text-sm hover:opacity-80 active:scale-95 transition">
          🌙
        </button>
      </div>
    </div>

    <!-- Template / Profile Bar + Live Template Editor -->
    <div class="px-3 py-2 border-b border-[var(--border-col)] flex items-center justify-between gap-1.5 bg-[var(--bg-card)]">
      <div class="flex items-center flex-1 min-w-0">
        <select id="profileSelect" onchange="changeProfile(this.value)" class="w-full bg-[var(--bg-btn)] text-[var(--text-main)] text-xs font-bold px-2.5 py-1.5 rounded-xl border border-[var(--border-col)] outline-none truncate">
        </select>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button onclick="toggleEditMode()" id="editProfileBtn" class="text-xs px-2.5 py-1.5 rounded-xl border border-[var(--border-col)] bg-[var(--bg-btn)] font-bold hover:border-sky-500 transition">
          ✏️ Editar
        </button>
        <button onclick="createNewProfile()" class="text-xs px-2.5 py-1.5 rounded-xl border border-sky-500/50 bg-sky-500/15 text-[var(--accent-blue)] font-bold hover:bg-sky-500/25 transition">
          + Plantilla
        </button>
      </div>
    </div>

    <!-- Edit Mode Notice Banner -->
    <div id="editBanner" class="hidden px-3.5 py-2 bg-amber-500/20 border-b border-amber-500/40 flex items-center justify-between gap-2">
      <span class="text-xs font-bold text-amber-500">✏️ Modo Edición: Toca cualquier botón para renombrarlo.</span>
      <div class="flex gap-1.5">
        <button onclick="deleteCurrentProfile()" id="delProfileBtn" class="hidden text-xs px-2 py-1 rounded-lg bg-rose-500/20 text-[var(--accent-red)] font-bold">Borrar</button>
        <button onclick="toggleEditMode()" class="text-xs px-2.5 py-1 rounded-lg bg-amber-500 text-black font-bold">Listo</button>
      </div>
    </div>

    <!-- Main Control Area -->
    <div class="p-3.5 space-y-3">
      
      <!-- Section 1: Option 1..4 (Codes 10\n .. 13\n -> Positions P1..P4) -->
      <div>
        <div class="flex justify-between items-center mb-1.5">
          <span class="text-[11px] font-bold uppercase tracking-wider text-[var(--text-muted)]">Opciones / Posiciones (10\n - 13\n)</span>
          <button onclick="toggleCodeBadges()" id="badgeBtn" class="text-xs font-bold text-[var(--accent-blue)] hover:underline">
            Mostrar códigos
          </button>
        </div>
        <div class="grid grid-cols-4 gap-2">
          <button onclick="handleButtonTap(10)" class="flex flex-col items-center justify-center p-2.5 rounded-2xl bg-[var(--bg-btn)] border border-[var(--border-col)] active:scale-95 transition hover:border-sky-500">
            <span class="font-extrabold text-xs sm:text-sm text-center leading-tight" id="lbl_10">P1 • ESTE</span>
            <span class="text-[11px] text-[var(--text-muted)] mt-0.5 font-medium" id="sub_10" data-base="Option 1">Option 1</span>
          </button>
          <button onclick="handleButtonTap(11)" class="flex flex-col items-center justify-center p-2.5 rounded-2xl bg-[var(--bg-btn)] border border-[var(--border-col)] active:scale-95 transition hover:border-sky-500">
            <span class="font-extrabold text-xs sm:text-sm text-center leading-tight" id="lbl_11">P2</span>
            <span class="text-[11px] text-[var(--text-muted)] mt-0.5 font-medium" id="sub_11" data-base="Option 2">Option 2</span>
          </button>
          <button onclick="handleButtonTap(12)" class="flex flex-col items-center justify-center p-2.5 rounded-2xl bg-[var(--bg-btn)] border border-[var(--border-col)] active:scale-95 transition hover:border-sky-500">
            <span class="font-extrabold text-xs sm:text-sm text-center leading-tight" id="lbl_12">P3</span>
            <span class="text-[11px] text-[var(--text-muted)] mt-0.5 font-medium" id="sub_12" data-base="Option 3">Option 3</span>
          </button>
          <button onclick="handleButtonTap(13)" class="flex flex-col items-center justify-center p-2.5 rounded-2xl bg-[var(--bg-btn)] border border-[var(--border-col)] active:scale-95 transition hover:border-sky-500">
            <span class="font-extrabold text-xs sm:text-sm text-center leading-tight" id="lbl_13">P4 • OESTE</span>
            <span class="text-[11px] text-[var(--text-muted)] mt-0.5 font-medium" id="sub_13" data-base="Option 4">Option 4</span>
          </button>
        </div>
      </div>

      <!-- Section 2: D-Pad / Jog & Action Keys -->
      <div class="grid grid-cols-3 gap-2.5 items-center">
        <!-- Top Row -->
        <button onclick="handleButtonTap(5)" class="h-14 rounded-2xl bg-[var(--bg-btn)] border border-[var(--border-col)] flex flex-col items-center justify-center active:scale-95 transition hover:border-sky-500">
          <span class="font-extrabold text-xs sm:text-sm" id="lbl_5">AUTO RGB</span>
          <span class="text-[11px] text-[var(--text-muted)] font-medium" id="sub_5" data-base="Plus (5)">Plus (5)</span>
        </button>

        <button onclick="handleButtonTap(1)" class="h-16 rounded-2xl bg-[var(--bg-pad)] border border-[var(--border-pad)] flex flex-col items-center justify-center active:scale-95 transition hover:opacity-90">
          <span class="text-base leading-none font-bold text-[var(--accent-blue)]">▲</span>
          <span class="text-xs font-extrabold mt-0.5" id="lbl_1">Jog +</span>
          <span class="hidden text-[10px] font-bold text-[var(--accent-blue)]" id="sub_1" data-base=""></span>
        </button>

        <button onclick="handleButtonTap(6)" class="h-14 rounded-2xl bg-[var(--bg-btn)] border border-[var(--border-col)] flex flex-col items-center justify-center active:scale-95 transition hover:border-sky-500">
          <span class="font-extrabold text-xs sm:text-sm" id="lbl_6">AUX</span>
          <span class="text-[11px] text-[var(--text-muted)] font-medium" id="sub_6" data-base="Minus (6)">Minus (6)</span>
        </button>

        <!-- Middle Row: Left, STOP (Center Emergency), Right -->
        <button onclick="handleButtonTap(2)" class="h-16 rounded-2xl bg-[var(--bg-pad)] border border-[var(--border-pad)] flex flex-col items-center justify-center active:scale-95 transition hover:opacity-90">
          <span class="text-base leading-none font-bold text-[var(--accent-blue)]">◀</span>
          <span class="text-xs font-extrabold mt-0.5" id="lbl_2">Jog ESTE</span>
          <span class="hidden text-[10px] font-bold text-[var(--accent-blue)]" id="sub_2" data-base=""></span>
        </button>

        <button onclick="handleButtonTap(7)" class="h-16 rounded-2xl bg-rose-600 border border-rose-500 text-white font-extrabold shadow-lg shadow-rose-600/25 flex flex-col items-center justify-center active:scale-95 transition hover:bg-rose-500">
          <span class="text-sm sm:text-base tracking-wider" id="lbl_7">✋ STOP</span>
          <span class="text-[11px] font-semibold opacity-95" id="sub_7" data-base="Emergencia">Emergencia</span>
        </button>

        <button onclick="handleButtonTap(3)" class="h-16 rounded-2xl bg-[var(--bg-pad)] border border-[var(--border-pad)] flex flex-col items-center justify-center active:scale-95 transition hover:opacity-90">
          <span class="text-base leading-none font-bold text-[var(--accent-blue)]">▶</span>
          <span class="text-xs font-extrabold mt-0.5" id="lbl_3">Jog OESTE</span>
          <span class="hidden text-[10px] font-bold text-[var(--accent-blue)]" id="sub_3" data-base=""></span>
        </button>

        <!-- Bottom Row: SAVE, Down, PLAY -->
        <button onclick="handleButtonTap(8)" class="h-14 rounded-2xl bg-[var(--bg-btn)] border border-[var(--border-col)] flex flex-col items-center justify-center active:scale-95 transition hover:border-sky-500">
          <span class="font-extrabold text-xs sm:text-sm" id="lbl_8">SAVE</span>
          <span class="text-[11px] text-[var(--text-muted)] font-medium" id="sub_8" data-base="Save (8)">Save (8)</span>
        </button>

        <button onclick="handleButtonTap(4)" class="h-16 rounded-2xl bg-[var(--bg-pad)] border border-[var(--border-pad)] flex flex-col items-center justify-center active:scale-95 transition hover:opacity-90">
          <span class="text-base leading-none font-bold text-[var(--accent-blue)]">▼</span>
          <span class="text-xs font-extrabold mt-0.5" id="lbl_4">Jog -</span>
          <span class="hidden text-[10px] font-bold text-[var(--accent-blue)]" id="sub_4" data-base=""></span>
        </button>

        <button onclick="handleButtonTap(9)" class="h-14 rounded-2xl bg-[var(--bg-btn)] border border-[var(--border-col)] flex flex-col items-center justify-center active:scale-95 transition hover:border-sky-500">
          <span class="font-extrabold text-xs sm:text-sm" id="lbl_9">PLAY</span>
          <span class="text-[11px] text-[var(--text-muted)] font-medium" id="sub_9" data-base="Play (9)">Play (9)</span>
        </button>
      </div>

      <!-- Section 3: Live BLE Serial Console -->
      <div class="border border-[var(--border-col)] rounded-2xl overflow-hidden bg-[var(--bg-surface)]">
        <div class="px-3 py-1.5 border-b border-[var(--border-col)] flex items-center justify-between">
          <span class="text-xs font-bold text-[var(--text-main)]">💻 Monitor Serial BLE</span>
          <button onclick="clearConsole()" class="text-xs font-bold text-[var(--accent-blue)] hover:underline">Limpiar</button>
        </div>
        <div id="consoleBox" class="h-28 overflow-y-auto p-2.5 font-mono text-xs space-y-1 bg-[var(--bg-console)]">
          <div class="text-[var(--text-muted)] font-medium">[SYS] Listo. Toca 📡 BLE para buscar (ej. joystick, Joystick 5) o ⚡ Rápida.</div>
        </div>
        <div class="p-1.5 border-t border-[var(--border-col)] flex gap-1.5 bg-[var(--bg-card)]">
          <input id="customCmd" type="text" placeholder="Comando libre (ej. 10)..." class="flex-1 bg-[var(--bg-btn)] text-[var(--text-main)] text-xs px-2.5 py-1.5 rounded-lg border border-[var(--border-col)] outline-none font-mono" onkeydown="if(event.key==='Enter') sendCustom()" />
          <button onclick="sendCustom()" class="px-3.5 py-1.5 rounded-lg bg-sky-600 text-white text-xs font-bold hover:bg-sky-500 transition">Enviar</button>
        </div>
      </div>

    </div>

    <!-- MODAL: Edit Button Label -->
    <div id="renameModal" class="hidden absolute inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-20">
      <div class="bg-[var(--bg-card)] border border-[var(--border-col)] rounded-2xl w-full max-w-xs p-4 shadow-2xl space-y-3">
        <h3 class="font-bold text-sm" id="renameTitle">Editar Botón</h3>
        <div>
          <label class="text-xs text-[var(--text-muted)] block mb-1">Nombre visible en la plantilla:</label>
          <input id="renameInput" type="text" class="w-full bg-[var(--bg-btn)] text-sm px-3 py-1.5 rounded-xl border border-[var(--border-col)] outline-none" onkeydown="if(event.key==='Enter') saveButtonLabel()" />
        </div>
        <div class="flex justify-end gap-2 pt-1">
          <button onclick="closeRenameModal()" class="px-3 py-1.5 rounded-xl text-xs bg-[var(--bg-btn)] font-semibold">Cancelar</button>
          <button onclick="saveButtonLabel()" class="px-3 py-1.5 rounded-xl text-xs bg-sky-600 text-white font-bold">Guardar</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    const NUS_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const NUS_RX_UUID      = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
    const NUS_TX_UUID      = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

    let bleDevice = null;
    let bleServer = null;
    let rxCharacteristic = null;
    let txCharacteristic = null;

    let isDark = true;
    let editMode = false;
    let editingCode = null;
    let showBadges = false;
    let currentProfile = 'pantalla';

    const defaultProfiles = {
      pantalla: {
        name: "📺 Pantalla Nueva (Options = P1-P4)",
        builtin: true,
        labels: {
          1: "Jog +", 2: "Jog ESTE", 3: "Jog OESTE", 4: "Jog -",
          5: "AUTO RGB", 6: "AUX", 7: "✋ STOP", 8: "SAVE", 9: "PLAY",
          10: "P1 • ESTE", 11: "P2", 12: "P3", 13: "P4 • OESTE"
        }
      },
      legado: {
        name: "🕹️ Código Viejo (Flechas = P1-P4)",
        builtin: true,
        labels: {
          1: "P1 • ESTE", 2: "P2", 3: "P3", 4: "P4 • OESTE",
          5: "AUTO RGB", 6: "MINUS", 7: "✋ STOP", 8: "SAVE", 9: "PLAY",
          10: "OPTION 1", 11: "OPTION 2", 12: "OPTION 3", 13: "OPTION 4"
        }
      },
      servo: {
        name: "⚙️ Debug Servo / Motor",
        builtin: true,
        labels: {
          1: "Tilt +10°", 2: "Pan -10°", 3: "Pan +10°", 4: "Tilt -10°",
          5: "Vel +", 6: "Vel -", 7: "✋ STOP", 8: "Guardar", 9: "Secuencia",
          10: "0° Home", 11: "45°", 12: "90°", 13: "180°"
        }
      },
      generico: {
        name: "🔢 Genérico (App Inventor)",
        builtin: true,
        labels: {
          1: "Arriba", 2: "Izquierda", 3: "Derecha", 4: "Abajo",
          5: "PLUS", 6: "MINUS", 7: "✋ STOP", 8: "SAVE", 9: "PLAY",
          10: "OPTION 1", 11: "OPTION 2", 12: "OPTION 3", 13: "OPTION 4"
        }
      }
    };

    let profiles = JSON.parse(localStorage.getItem('esp32_ble_profiles_v2')) || defaultProfiles;

    function saveProfilesToStorage() {
      localStorage.setItem('esp32_ble_profiles_v2', JSON.stringify(profiles));
    }

    function initApp() {
      const savedTheme = localStorage.getItem('esp32_ble_theme');
      if (savedTheme !== null) {
        setTheme(savedTheme === 'dark');
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        setTheme(false);
      } else {
        setTheme(true);
      }

      renderProfileSelector();
      const lastProf = localStorage.getItem('esp32_ble_last_profile');
      if (lastProf && profiles[lastProf]) {
        currentProfile = lastProf;
        document.getElementById('profileSelect').value = currentProfile;
      }
      changeProfile(currentProfile);

      const lastDevName = localStorage.getItem('esp32_ble_last_device');
      if (lastDevName) {
        document.getElementById('deviceHint').innerText = `Último: ${lastDevName} (Toca ⚡)`;
      }
    }

    function renderProfileSelector() {
      const sel = document.getElementById('profileSelect');
      sel.innerHTML = '';
      Object.keys(profiles).forEach(k => {
        const opt = document.createElement('option');
        opt.value = k;
        opt.innerText = profiles[k].name;
        sel.appendChild(opt);
      });
    }

    function setTheme(dark) {
      isDark = dark;
      document.body.className = isDark
        ? 'theme-dark bg-[var(--bg-main)] text-[var(--text-main)] antialiased p-2.5 sm:p-5 select-none transition-colors duration-200'
        : 'theme-light bg-[var(--bg-main)] text-[var(--text-main)] antialiased p-2.5 sm:p-5 select-none transition-colors duration-200';
      document.getElementById('themeBtn').innerText = isDark ? '🌙' : '☀️';
      localStorage.setItem('esp32_ble_theme', isDark ? 'dark' : 'light');
    }

    function toggleTheme() {
      setTheme(!isDark);
    }

    async function scanBleDevice() {
      if (!navigator.bluetooth) {
        logConsole('ERR', 'Web Bluetooth no disponible en este navegador. En iOS usa la app gratuita "Bluefy" y en Android usa Chrome.');
        return;
      }
      try {
        logConsole('BLE', 'Buscando dispositivos BLE cercanos...');
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [NUS_SERVICE_UUID]
        });
        await connectToDevice(device);
      } catch (err) {
        if (err.name !== 'NotFoundError') {
          logConsole('ERR', `Error al escanear: ${err.message}`);
        }
      }
    }

    async function quickReconnect() {
      if (bleDevice) {
        logConsole('BLE', `Reconectando rápido a "${bleDevice.name || 'ESP32'}"...`);
        await connectToDevice(bleDevice);
        return;
      }
      if (navigator.bluetooth && navigator.bluetooth.getDevices) {
        try {
          const devices = await navigator.bluetooth.getDevices();
          if (devices.length > 0) {
            const lastDevName = localStorage.getItem('esp32_ble_last_device');
            const target = devices.find(d => d.name === lastDevName) || devices[0];
            logConsole('BLE', `Reconectando a "${target.name || 'ESP32'}"...`);
            await connectToDevice(target);
            return;
          }
        } catch (_) {}
      }
      await scanBleDevice();
    }

    async function connectToDevice(device) {
      try {
        bleDevice = device;
        bleDevice.removeEventListener('gattserverdisconnected', onDisconnected);
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        bleServer = await bleDevice.gatt.connect();
        const service = await bleServer.getPrimaryService(NUS_SERVICE_UUID);
        rxCharacteristic = await service.getCharacteristic(NUS_RX_UUID);
        txCharacteristic = await service.getCharacteristic(NUS_TX_UUID);

        await txCharacteristic.startNotifications();
        txCharacteristic.addEventListener('characteristicvaluechanged', onBleDataReceived);

        const name = bleDevice.name || 'ESP32 BLE';
        localStorage.setItem('esp32_ble_last_device', name);
        updateConnectionUI(true, name);
        logConsole('BLE', `Conectado a "${name}"`);
      } catch (err) {
        updateConnectionUI(false);
        logConsole('ERR', `No se pudo conectar: ${err.message}`);
      }
    }

    function onDisconnected() {
      updateConnectionUI(false);
      logConsole('BLE', `Desconectado de "${bleDevice ? bleDevice.name : 'ESP32'}". Toca ⚡ para reconectar.`);
    }

    function onBleDataReceived(event) {
      const decoder = new TextDecoder('utf-8');
      const text = decoder.decode(event.target.value).trim();
      if (text) {
        text.split('\n').forEach(line => {
          if (line.trim()) logConsole('RX', line.trim());
        });
      }
    }

    function updateConnectionUI(connected, name = '') {
      const dot = document.getElementById('statusDot');
      const badge = document.getElementById('statusBadge');
      const devName = document.getElementById('deviceName');
      const hint = document.getElementById('deviceHint');

      if (connected) {
        dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse shrink-0';
        badge.className = 'text-[11px] px-1.5 py-0.5 rounded-md bg-emerald-500/20 text-[var(--accent-green)] font-bold shrink-0';
        badge.innerText = 'BLE';
        devName.innerText = name;
        hint.innerText = 'Conectado • Toca para cambiar';
      } else {
        dot.className = 'w-2.5 h-2.5 rounded-full bg-rose-500 shrink-0';
        badge.className = 'text-[11px] px-1.5 py-0.5 rounded-md bg-rose-500/20 text-[var(--accent-red)] font-bold shrink-0';
        badge.innerText = 'Off';
        const last = localStorage.getItem('esp32_ble_last_device');
        devName.innerText = last ? `${last}` : 'Sin conectar';
        hint.innerText = 'Toca ⚡ o 📡 para conectar';
      }
    }

    async function sendCmd(num) {
      if (navigator.vibrate) navigator.vibrate(25);
      const payload = `${num}\n`;

      if (!bleDevice || !bleDevice.gatt.connected || !rxCharacteristic) {
        logConsole('ERR', `No conectado (Comando "${num}\\n" no enviado).`);
        return;
      }

      try {
        const encoder = new TextEncoder();
        await rxCharacteristic.writeValue(encoder.encode(payload));
        logConsole('TX', `[BLE] -> "${num}\\n"`);
      } catch (err) {
        logConsole('ERR', `Fallo al enviar: ${err.message}`);
      }
    }

    function sendCustom() {
      const input = document.getElementById('customCmd');
      const val = input.value.trim();
      if (!val) return;
      input.value = '';
      sendCmd(val);
    }

    function changeProfile(key) {
      if (!profiles[key]) return;
      currentProfile = key;
      localStorage.setItem('esp32_ble_last_profile', key);
      const labels = profiles[key].labels;
      Object.keys(labels).forEach(k => {
        const el = document.getElementById('lbl_' + k);
        if (el) el.innerText = labels[k];
      });
      document.getElementById('delProfileBtn').classList.toggle('hidden', !!profiles[key].builtin);
    }

    function toggleEditMode() {
      editMode = !editMode;
      document.getElementById('editBanner').classList.toggle('hidden', !editMode);
      document.getElementById('editProfileBtn').innerText = editMode ? '✅ Listo' : '✏️ Editar';
    }

    function createNewProfile() {
      const name = prompt("Nombre de la nueva plantilla (ej. Brazo Robótico):", "🤖 Nuevo Proyecto");
      if (!name || !name.trim()) return;
      const key = 'custom_' + Date.now();
      profiles[key] = {
        name: name.trim(),
        builtin: false,
        labels: { ...profiles[currentProfile].labels }
      };
      saveProfilesToStorage();
      renderProfileSelector();
      document.getElementById('profileSelect').value = key;
      changeProfile(key);
      if (!editMode) toggleEditMode();
    }

    function deleteCurrentProfile() {
      if (profiles[currentProfile].builtin) return;
      if (!confirm(`¿Eliminar la plantilla "${profiles[currentProfile].name}"?`)) return;
      delete profiles[currentProfile];
      saveProfilesToStorage();
      renderProfileSelector();
      changeProfile('pantalla');
      toggleEditMode();
    }

    function handleButtonTap(code) {
      if (editMode) {
        editingCode = code;
        document.getElementById('renameTitle').innerText = `Cambiar nombre (Envía "${code}\\n")`;
        document.getElementById('renameInput').value = profiles[currentProfile].labels[code];
        document.getElementById('renameModal').classList.remove('hidden');
        document.getElementById('renameInput').focus();
        return;
      }
      sendCmd(code);
    }

    function saveButtonLabel() {
      const val = document.getElementById('renameInput').value.trim();
      if (val && editingCode) {
        profiles[currentProfile].labels[editingCode] = val;
        document.getElementById('lbl_' + editingCode).innerText = val;
        saveProfilesToStorage();
      }
      closeRenameModal();
    }

    function closeRenameModal() {
      document.getElementById('renameModal').classList.add('hidden');
      editingCode = null;
    }

    function toggleCodeBadges() {
      showBadges = !showBadges;
      for (let i = 1; i <= 13; i++) {
        const sub = document.getElementById('sub_' + i);
        if (!sub) continue;
        const base = sub.getAttribute('data-base') || '';
        if (showBadges) {
          sub.innerText = base ? `${base} • ${i}\\n` : `Código: ${i}\\n`;
          sub.classList.remove('hidden');
        } else {
          sub.innerText = base;
          if (!base) sub.classList.add('hidden');
        }
      }
      document.getElementById('badgeBtn').innerText = showBadges ? 'Ocultar códigos' : 'Mostrar códigos';
    }

    function logConsole(type, text) {
      const box = document.getElementById('consoleBox');
      const line = document.createElement('div');
      const color = type === 'TX'
        ? 'text-[var(--accent-blue)] font-semibold'
        : (type === 'RX' || type === 'BLE')
          ? 'text-[var(--accent-green)] font-semibold'
          : type === 'ERR'
            ? 'text-[var(--accent-red)] font-semibold'
            : 'text-[var(--text-muted)] font-medium';
      line.className = color;
      line.innerText = `[${type}] ${text}`;
      box.appendChild(line);
      box.scrollTop = box.scrollHeight;
    }

    function clearConsole() {
      document.getElementById('consoleBox').innerHTML = '';
    }

    initApp();
  </script>
</body>
</html>
