<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <title>ESP32 BLE Control Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body.theme-light {
      --bg-main: #f1f5f9;
      --bg-card: #ffffff;
      --bg-surface: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-col: #cbd5e1;
    }
    body.theme-dark {
      --bg-main: #090d16;
      --bg-card: #111827;
      --bg-surface: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-col: #334155;
    }
  </style>
</head>
<body class="theme-dark bg-[var(--bg-main)] text-[var(--text-main)] antialiased p-2.5 sm:p-5 select-none transition-colors duration-200">
  <div class="max-w-md mx-auto bg-[var(--bg-card)] border border-[var(--border-col)] rounded-3xl shadow-xl overflow-hidden flex flex-col relative">
    
    <!-- Top Bar: Connection Status, Quick Connect, BLE Scanner | Dark Mode Toggle -->
    <div class="p-3.5 border-b border-[var(--border-col)] bg-[var(--bg-surface)] flex items-center justify-between gap-2">
      <!-- Left: Current Device & Status -->
      <button onclick="scanBleDevice()" class="flex items-center gap-2.5 text-left group hover:opacity-90 transition min-w-0">
        <span id="statusDot" class="w-3 h-3 rounded-full bg-rose-500 shrink-0"></span>
        <div class="min-w-0">
          <div class="flex items-center gap-1.5">
            <span class="font-bold text-sm truncate" id="deviceName">Sin conectar</span>
            <span class="text-xs px-2 py-0.5 rounded-full bg-rose-500/15 text-rose-400 font-semibold shrink-0" id="statusBadge">Off</span>
          </div>
          <p class="text-xs text-[var(--text-muted)] truncate" id="deviceHint">Toca 📡 para buscar o ⚡ para reconectar</p>
        </div>
      </button>

      <!-- Right: Quick Reconnect + BLE Search | Separator | Night Mode Toggle -->
      <div class="flex items-center gap-1.5 shrink-0">
        <button onclick="quickReconnect()" id="quickConnBtn" title="Conexión rápida al último ESP32" class="px-2.5 py-1.5 rounded-xl text-xs font-semibold border border-emerald-500/40 bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500/20 active:scale-95 transition flex items-center gap-1">
          <span>⚡</span>
          <span class="hidden sm:inline">Rápida</span>
        </button>

        <button onclick="scanBleDevice()" title="Buscar dispositivo BLE" class="px-2.5 py-1.5 rounded-xl text-xs font-semibold border border-[var(--border-col)] bg-[var(--bg-card)] hover:border-sky-500 active:scale-95 transition flex items-center gap-1">
          <span>📡</span>
          <span>BLE</span>
        </button>

        <!-- Vertical Separator -->
        <div class="h-6 w-[1px] bg-[var(--border-col)] mx-0.5"></div>

        <!-- Far-Right: Dark/Light Mode Button -->
        <button onclick="toggleTheme()" id="themeBtn" title="Activar / Desactivar Modo Oscuro" class="p-2 rounded-xl border border-[var(--border-col)] bg-[var(--bg-card)] text-sm hover:opacity-80 active:scale-95 transition">
          🌙
        </button>
      </div>
    </div>

    <!-- Template / Profile Bar + Live Template Editor -->
    <div class="px-3.5 py-2.5 border-b border-[var(--border-col)] flex items-center justify-between gap-2 bg-[var(--bg-card)]">
      <div class="flex items-center gap-1.5 flex-1 min-w-0">
        <select id="profileSelect" onchange="changeProfile(this.value)" class="bg-[var(--bg-surface)] text-[var(--text-main)] text-xs font-semibold px-2.5 py-1.5 rounded-xl border border-[var(--border-col)] flex-1 outline-none truncate">
        </select>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="toggleEditMode()" id="editProfileBtn" class="text-xs px-2.5 py-1.5 rounded-xl border border-[var(--border-col)] bg-[var(--bg-surface)] font-medium hover:border-sky-500 transition">
          ✏️ Editar
        </button>
        <button onclick="createNewProfile()" class="text-xs px-2.5 py-1.5 rounded-xl border border-sky-500/40 bg-sky-500/10 text-sky-400 font-semibold hover:bg-sky-500/20 transition">
          + Plantilla
        </button>
      </div>
    </div>

    <!-- Edit Mode Notice Banner -->
    <div id="editBanner" class="hidden px-3.5 py-2 bg-amber-500/15 border-b border-amber-500/30 flex items-center justify-between gap-2">
      <span class="text-xs text-amber-400 font-medium">✏️ <b>Modo Edición:</b> Toca cualquier botón para renombrarlo.</span>
      <div class="flex gap-1.5">
        <button onclick="deleteCurrentProfile()" id="delProfileBtn" class="hidden text-xs px-2 py-1 rounded-lg bg-rose-500/20 text-rose-400 font-semibold">Borrar</button>
        <button onclick="toggleEditMode()" class="text-xs px-2.5 py-1 rounded-lg bg-amber-500 text-black font-bold">Listo</button>
      </div>
    </div>

    <!-- Main Control Area (Zero Scroll Required) -->
    <div class="p-3.5 sm:p-4 space-y-3.5">
      
      <!-- Section 1: Option 1..4 (Codes 10\n .. 13\n -> Positions P1..P4) -->
      <div>
        <div class="flex justify-between items-center mb-1.5">
          <span class="text-xs font-semibold uppercase tracking-wider text-[var(--text-muted)]">Opciones / Posiciones (10\n - 13\n)</span>
          <button onclick="toggleCodeBadges()" id="badgeBtn" class="text-xs text-sky-400 hover:underline">
            Mostrar códigos
          </button>
        </div>
        <div class="grid grid-cols-4 gap-2">
          <button onclick="handleButtonTap(10)" class="relative flex flex-col items-center justify-center p-2.5 rounded-xl bg-[var(--bg-surface)] border border-[var(--border-col)] active:scale-95 transition hover:border-sky-500">
            <span class="font-bold text-xs sm:text-sm text-center leading-tight" id="lbl_10">P1 • ESTE</span>
            <span class="text-xs text-[var(--text-muted)] mt-0.5">Option 1</span>
            <span class="code-badge hidden absolute top-1 right-1 text-xs px-1 rounded bg-sky-500/20 text-sky-400 font-mono">10\n</span>
          </button>
          <button onclick="handleButtonTap(11)" class="relative flex flex-col items-center justify-center p-2.5 rounded-xl bg-[var(--bg-surface)] border border-[var(--border-col)] active:scale-95 transition hover:border-sky-500">
            <span class="font-bold text-xs sm:text-sm text-center leading-tight" id="lbl_11">P2</span>
            <span class="text-xs text-[var(--text-muted)] mt-0.5">Option 2</span>
            <span class="code-badge hidden absolute top-1 right-1 text-xs px-1 rounded bg-sky-500/20 text-sky-400 font-mono">11\n</span>
          </button>
          <button onclick="handleButtonTap(12)" class="relative flex flex-col items-center justify-center p-2.5 rounded-xl bg-[var(--bg-surface)] border border-[var(--border-col)] active:scale-95 transition hover:border-sky-500">
            <span class="font-bold text-xs sm:text-sm text-center leading-tight" id="lbl_12">P3</span>
            <span class="text-xs text-[var(--text-muted)] mt-0.5">Option 3</span>
            <span class="code-badge hidden absolute top-1 right-1 text-xs px-1 rounded bg-sky-500/20 text-sky-400 font-mono">12\n</span>
          </button>
          <button onclick="handleButtonTap(13)" class="relative flex flex-col items-center justify-center p-2.5 rounded-xl bg-[var(--bg-surface)] border border-[var(--border-col)] active:scale-95 transition hover:border-sky-500">
            <span class="font-bold text-xs sm:text-sm text-center leading-tight" id="lbl_13">P4 • OESTE</span>
            <span class="text-xs text-[var(--text-muted)] mt-0.5">Option 4</span>
            <span class="code-badge hidden absolute top-1 right-1 text-xs px-1 rounded bg-sky-500/20 text-sky-400 font-mono">13\n</span>
          </button>
        </div>
      </div>

      <!-- Section 2: D-Pad / Jog & Action Keys -->
      <div class="grid grid-cols-3 gap-2.5 items-center">
        <!-- Top Row -->
        <button onclick="handleButtonTap(5)" class="relative h-14 rounded-2xl bg-[var(--bg-surface)] border border-[var(--border-col)] flex flex-col items-center justify-center active:scale-95 transition hover:border-sky-500">
          <span class="font-bold text-sm" id="lbl_5">➕ AUTO</span>
          <span class="text-xs text-[var(--text-muted)]">Plus (5)</span>
          <span class="code-badge hidden absolute top-1 right-1.5 text-xs px-1 rounded bg-sky-500/20 text-sky-400 font-mono">5\n</span>
        </button>

        <button onclick="handleButtonTap(1)" class="relative h-16 rounded-2xl bg-sky-500/15 border border-sky-500/40 flex flex-col items-center justify-center active:scale-95 transition hover:bg-sky-500/25">
          <span class="text-lg leading-none">▲</span>
          <span class="text-xs font-semibold mt-0.5" id="lbl_1">Jog +</span>
          <span class="code-badge hidden absolute top-1 right-1.5 text-xs px-1 rounded bg-sky-500/20 text-sky-400 font-mono">1\n</span>
        </button>

        <button onclick="handleButtonTap(6)" class="relative h-14 rounded-2xl bg-[var(--bg-surface)] border border-[var(--border-col)] flex flex-col items-center justify-center active:scale-95 transition hover:border-sky-500">
          <span class="font-bold text-sm" id="lbl_6">➖ AUX</span>
          <span class="text-xs text-[var(--text-muted)]">Minus (6)</span>
          <span class="code-badge hidden absolute top-1 right-1.5 text-xs px-1 rounded bg-sky-500/20 text-sky-400 font-mono">6\n</span>
        </button>

        <!-- Middle Row: Left, STOP (Center Emergency), Right -->
        <button onclick="handleButtonTap(2)" class="relative h-16 rounded-2xl bg-sky-500/15 border border-sky-500/40 flex flex-col items-center justify-center active:scale-95 transition hover:bg-sky-500/25">
          <span class="text-lg leading-none">◀</span>
          <span class="text-xs font-semibold mt-0.5" id="lbl_2">Jog ESTE</span>
          <span class="code-badge hidden absolute top-1 right-1.5 text-xs px-1 rounded bg-sky-500/20 text-sky-400 font-mono">2\n</span>
        </button>

        <button onclick="handleButtonTap(7)" class="relative h-16 rounded-2xl bg-rose-600 text-white font-extrabold shadow-lg shadow-rose-600/30 flex flex-col items-center justify-center active:scale-95 transition hover:bg-rose-500">
          <span class="text-base tracking-wider" id="lbl_7">🛑 STOP</span>
          <span class="text-xs font-normal opacity-90">Emergencia</span>
          <span class="code-badge hidden absolute top-1 right-1.5 text-xs px-1 rounded bg-black/30 text-white font-mono">7\n</span>
        </button>

        <button onclick="handleButtonTap(3)" class="relative h-16 rounded-2xl bg-sky-500/15 border border-sky-500/40 flex flex-col items-center justify-center active:scale-95 transition hover:bg-sky-500/25">
          <span class="text-lg leading-none">▶</span>
          <span class="text-xs font-semibold mt-0.5" id="lbl_3">Jog OESTE</span>
          <span class="code-badge hidden absolute top-1 right-1.5 text-xs px-1 rounded bg-sky-500/20 text-sky-400 font-mono">3\n</span>
        </button>

        <!-- Bottom Row: SAVE, Down, PLAY -->
        <button onclick="handleButtonTap(8)" class="relative h-14 rounded-2xl bg-[var(--bg-surface)] border border-[var(--border-col)] flex flex-col items-center justify-center active:scale-95 transition hover:border-sky-500">
          <span class="font-bold text-sm" id="lbl_8">💾 SAVE</span>
          <span class="text-xs text-[var(--text-muted)]">Guardar (8)</span>
          <span class="code-badge hidden absolute top-1 right-1.5 text-xs px-1 rounded bg-sky-500/20 text-sky-400 font-mono">8\n</span>
        </button>

        <button onclick="handleButtonTap(4)" class="relative h-16 rounded-2xl bg-sky-500/15 border border-sky-500/40 flex flex-col items-center justify-center active:scale-95 transition hover:bg-sky-500/25">
          <span class="text-lg leading-none">▼</span>
          <span class="text-xs font-semibold mt-0.5" id="lbl_4">Jog -</span>
          <span class="code-badge hidden absolute top-1 right-1.5 text-xs px-1 rounded bg-sky-500/20 text-sky-400 font-mono">4\n</span>
        </button>

        <button onclick="handleButtonTap(9)" class="relative h-14 rounded-2xl bg-[var(--bg-surface)] border border-[var(--border-col)] flex flex-col items-center justify-center active:scale-95 transition hover:border-sky-500">
          <span class="font-bold text-sm" id="lbl_9">▶️ PLAY</span>
          <span class="text-xs text-[var(--text-muted)]">Ejecutar (9)</span>
          <span class="code-badge hidden absolute top-1 right-1.5 text-xs px-1 rounded bg-sky-500/20 text-sky-400 font-mono">9\n</span>
        </button>
      </div>

      <!-- Section 3: Live BLE Serial Console -->
      <div class="border border-[var(--border-col)] rounded-2xl overflow-hidden bg-[var(--bg-surface)]">
        <div class="px-3 py-1.5 border-b border-[var(--border-col)] flex items-center justify-between">
          <span class="text-xs font-semibold text-[var(--text-muted)]">💻 Monitor Serial BLE (ESP32 ↔ App)</span>
          <button onclick="clearConsole()" class="text-xs text-[var(--text-muted)] hover:underline">Limpiar</button>
        </div>
        <div id="consoleBox" class="h-28 overflow-y-auto p-2.5 font-mono text-xs space-y-1 bg-black/15">
          <div class="text-[var(--text-muted)]">[SYS] Listo. Toca 📡 BLE para buscar (ej. joystick, Joystick 5) o ⚡ para reconectar.</div>
        </div>
        <div class="p-1.5 border-t border-[var(--border-col)] flex gap-1.5 bg-[var(--bg-card)]">
          <input id="customCmd" type="text" placeholder="Enviar comando libre (ej. 10)..." class="flex-1 bg-[var(--bg-surface)] text-xs px-2.5 py-1.5 rounded-lg border border-[var(--border-col)] outline-none font-mono" onkeydown="if(event.key==='Enter') sendCustom()" />
          <button onclick="sendCustom()" class="px-3 py-1.5 rounded-lg bg-sky-500 text-white text-xs font-semibold hover:bg-sky-400 transition">Enviar</button>
        </div>
      </div>

    </div>

    <!-- MODAL: Edit Button Label -->
    <div id="renameModal" class="hidden absolute inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-20">
      <div class="bg-[var(--bg-card)] border border-[var(--border-col)] rounded-2xl w-full max-w-xs p-4 shadow-2xl space-y-3">
        <h3 class="font-bold text-sm" id="renameTitle">Editar Botón</h3>
        <div>
          <label class="text-xs text-[var(--text-muted)] block mb-1">Nombre visible en la plantilla:</label>
          <input id="renameInput" type="text" class="w-full bg-[var(--bg-surface)] text-sm px-3 py-1.5 rounded-xl border border-[var(--border-col)] outline-none" onkeydown="if(event.key==='Enter') saveButtonLabel()" />
        </div>
        <div class="flex justify-end gap-2 pt-1">
          <button onclick="closeRenameModal()" class="px-3 py-1.5 rounded-xl text-xs bg-[var(--bg-surface)]">Cancelar</button>
          <button onclick="saveButtonLabel()" class="px-3 py-1.5 rounded-xl text-xs bg-sky-500 text-white font-semibold">Guardar</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ==================== BLE NORDIC UART SERVICE UUIDS ====================
    const NUS_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const NUS_RX_UUID      = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // App escribe al ESP32
    const NUS_TX_UUID      = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // ESP32 notifica a la App

    let bleDevice = null;
    let bleServer = null;
    let rxCharacteristic = null;
    let txCharacteristic = null;

    let isDark = true;
    let editMode = false;
    let editingCode = null;
    let showBadges = false;
    let currentProfile = 'pantalla';

    // Plantillas por defecto
    const defaultProfiles = {
      pantalla: {
        name: "📺 Pantalla Móvil (P1-P4)",
        builtin: true,
        labels: {
          1: "Jog +", 2: "Jog ESTE", 3: "Jog OESTE", 4: "Jog -",
          5: "➕ AUTO", 6: "➖ AUX", 7: "🛑 STOP", 8: "💾 SAVE", 9: "▶️ PLAY",
          10: "P1 • ESTE", 11: "P2", 12: "P3", 13: "P4 • OESTE"
        }
      },
      servo: {
        name: "⚙️ Debug Servo / Motor",
        builtin: true,
        labels: {
          1: "Tilt +10°", 2: "Pan -10°", 3: "Pan +10°", 4: "Tilt -10°",
          5: "➕ Vel +", 6: "➖ Vel -", 7: "🛑 STOP", 8: "💾 Guardar", 9: "▶️ Secuencia",
          10: "0° Home", 11: "45°", 12: "90°", 13: "180°"
        }
      },
      generico: {
        name: "🔢 Genérico (App Inventor)",
        builtin: true,
        labels: {
          1: "Arriba", 2: "Izquierda", 3: "Derecha", 4: "Abajo",
          5: "➕ PLUS", 6: "➖ MINUS", 7: "🛑 STOP", 8: "💾 SAVE", 9: "▶️ PLAY",
          10: "OPTION 1", 11: "OPTION 2", 12: "OPTION 3", 13: "OPTION 4"
        }
      }
    };

    let profiles = JSON.parse(localStorage.getItem('esp32_ble_profiles')) || defaultProfiles;

    function saveProfilesToStorage() {
      localStorage.setItem('esp32_ble_profiles', JSON.stringify(profiles));
    }

    function initApp() {
      // Tema responsive al sistema o guardado por el usuario
      const savedTheme = localStorage.getItem('esp32_ble_theme');
      if (savedTheme !== null) {
        setTheme(savedTheme === 'dark');
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        setTheme(false);
      } else {
        setTheme(true);
      }

      renderProfileSelector();
      const lastProf = localStorage.getItem('esp32_ble_last_profile');
      if (lastProf && profiles[lastProf]) {
        currentProfile = lastProf;
        document.getElementById('profileSelect').value = currentProfile;
      }
      changeProfile(currentProfile);

      const lastDevName = localStorage.getItem('esp32_ble_last_device');
      if (lastDevName) {
        document.getElementById('deviceHint').innerText = `Último: ${lastDevName} (Toca ⚡ para reconectar)`;
      }
    }

    function renderProfileSelector() {
      const sel = document.getElementById('profileSelect');
      sel.innerHTML = '';
      Object.keys(profiles).forEach(k => {
        const opt = document.createElement('option');
        opt.value = k;
        opt.innerText = profiles[k].name;
        sel.appendChild(opt);
      });
    }

    // ==================== TEMA CLARO / OSCURO ====================
    function setTheme(dark) {
      isDark = dark;
      document.body.className = isDark
        ? 'theme-dark bg-[var(--bg-main)] text-[var(--text-main)] antialiased p-2.5 sm:p-5 select-none transition-colors duration-200'
        : 'theme-light bg-[var(--bg-main)] text-[var(--text-main)] antialiased p-2.5 sm:p-5 select-none transition-colors duration-200';
      document.getElementById('themeBtn').innerText = isDark ? '🌙' : '☀️';
      localStorage.setItem('esp32_ble_theme', isDark ? 'dark' : 'light');
    }

    function toggleTheme() {
      setTheme(!isDark);
    }

    // ==================== CONEXIÓN BLE Y CONEXIÓN RÁPIDA ====================
    async function scanBleDevice() {
      if (!navigator.bluetooth) {
        logConsole('ERR', 'Web Bluetooth no disponible en este navegador. En iOS usa la app gratuita "Bluefy" y en Android usa Chrome.');
        return;
      }
      try {
        logConsole('BLE', 'Buscando dispositivos BLE cercanos...');
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [NUS_SERVICE_UUID]
        });
        await connectToDevice(device);
      } catch (err) {
        if (err.name !== 'NotFoundError') {
          logConsole('ERR', `Error al escanear: ${err.message}`);
        }
      }
    }

    async function quickReconnect() {
      // Si ya tenemos la referencia del dispositivo en la sesión actual, reconecta directo sin abrir popup
      if (bleDevice) {
        logConsole('BLE', `Reconectando rápido a "${bleDevice.name || 'ESP32'}"...`);
        await connectToDevice(bleDevice);
        return;
      }
      // Si el navegador soporta navigator.bluetooth.getDevices() (dispositivos autorizados previamente)
      if (navigator.bluetooth && navigator.bluetooth.getDevices) {
        try {
          const devices = await navigator.bluetooth.getDevices();
          if (devices.length > 0) {
            const lastDevName = localStorage.getItem('esp32_ble_last_device');
            const target = devices.find(d => d.name === lastDevName) || devices[0];
            logConsole('BLE', `Reconectando a "${target.name || 'ESP32'}"...`);
            await connectToDevice(target);
            return;
          }
        } catch (_) {}
      }
      // Fallback: abre el selector filtrado directamente
      await scanBleDevice();
    }

    async function connectToDevice(device) {
      try {
        bleDevice = device;
        bleDevice.removeEventListener('gattserverdisconnected', onDisconnected);
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        bleServer = await bleDevice.gatt.connect();
        const service = await bleServer.getPrimaryService(NUS_SERVICE_UUID);
        rxCharacteristic = await service.getCharacteristic(NUS_RX_UUID);
        txCharacteristic = await service.getCharacteristic(NUS_TX_UUID);

        await txCharacteristic.startNotifications();
        txCharacteristic.addEventListener('characteristicvaluechanged', onBleDataReceived);

        const name = bleDevice.name || 'ESP32 BLE';
        localStorage.setItem('esp32_ble_last_device', name);
        updateConnectionUI(true, name);
        logConsole('BLE', `Conectado a "${name}"`);
      } catch (err) {
        updateConnectionUI(false);
        logConsole('ERR', `No se pudo conectar: ${err.message}`);
      }
    }

    function onDisconnected() {
      updateConnectionUI(false);
      logConsole('BLE', `Desconectado de "${bleDevice ? bleDevice.name : 'ESP32'}". Toca ⚡ para reconectar.`);
    }

    function onBleDataReceived(event) {
      const decoder = new TextDecoder('utf-8');
      const text = decoder.decode(event.target.value).trim();
      if (text) {
        text.split('\n').forEach(line => {
          if (line.trim()) logConsole('RX', line.trim());
        });
      }
    }

    function updateConnectionUI(connected, name = '') {
      const dot = document.getElementById('statusDot');
      const badge = document.getElementById('statusBadge');
      const devName = document.getElementById('deviceName');
      const hint = document.getElementById('deviceHint');

      if (connected) {
        dot.className = 'w-3 h-3 rounded-full bg-emerald-500 animate-pulse shrink-0';
        badge.className = 'text-xs px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 font-semibold shrink-0';
        badge.innerText = 'Conectado';
        devName.innerText = name;
        hint.innerText = 'Canal UART BLE activo';
      } else {
        dot.className = 'w-3 h-3 rounded-full bg-rose-500 shrink-0';
        badge.className = 'text-xs px-2 py-0.5 rounded-full bg-rose-500/15 text-rose-400 font-semibold shrink-0';
        badge.innerText = 'Off';
        const last = localStorage.getItem('esp32_ble_last_device');
        devName.innerText = last ? `${last} (Off)` : 'Sin conectar';
        hint.innerText = 'Toca ⚡ para reconectar o 📡 para buscar';
      }
    }

    // ==================== ENVÍO DE COMANDOS (1\n al 13\n) ====================
    async function sendCmd(num) {
      if (navigator.vibrate) navigator.vibrate(25);
      const payload = `${num}\n`;

      if (!bleDevice || !bleDevice.gatt.connected || !rxCharacteristic) {
        logConsole('ERR', `No conectado (Comando "${num}\\n" no enviado). Toca ⚡ o 📡.`);
        return;
      }

      try {
        const encoder = new TextEncoder();
        await rxCharacteristic.writeValue(encoder.encode(payload));
        logConsole('TX', `Enviado -> "${num}\\n"`);
      } catch (err) {
        logConsole('ERR', `Fallo al enviar: ${err.message}`);
      }
    }

    function sendCustom() {
      const input = document.getElementById('customCmd');
      const val = input.value.trim();
      if (!val) return;
      input.value = '';
      sendCmd(val);
    }

    // ==================== GESTIÓN DE PLANTILLAS ====================
    function changeProfile(key) {
      if (!profiles[key]) return;
      currentProfile = key;
      localStorage.setItem('esp32_ble_last_profile', key);
      const labels = profiles[key].labels;
      Object.keys(labels).forEach(k => {
        const el = document.getElementById('lbl_' + k);
        if (el) el.innerText = labels[k];
      });
      document.getElementById('delProfileBtn').classList.toggle('hidden', !!profiles[key].builtin);
    }

    function toggleEditMode() {
      editMode = !editMode;
      document.getElementById('editBanner').classList.toggle('hidden', !editMode);
      document.getElementById('editProfileBtn').innerText = editMode ? '✅ Guardar' : '✏️ Editar';
    }

    function createNewProfile() {
      const name = prompt("Nombre de la nueva plantilla (ej. Brazo Robótico):", "🤖 Nuevo Proyecto");
      if (!name || !name.trim()) return;
      const key = 'custom_' + Date.now();
      profiles[key] = {
        name: name.trim(),
        builtin: false,
        labels: { ...profiles[currentProfile].labels }
      };
      saveProfilesToStorage();
      renderProfileSelector();
      document.getElementById('profileSelect').value = key;
      changeProfile(key);
      if (!editMode) toggleEditMode();
    }

    function deleteCurrentProfile() {
      if (profiles[currentProfile].builtin) return;
      if (!confirm(`¿Eliminar la plantilla "${profiles[currentProfile].name}"?`)) return;
      delete profiles[currentProfile];
      saveProfilesToStorage();
      renderProfileSelector();
      changeProfile('pantalla');
      toggleEditMode();
    }

    function handleButtonTap(code) {
      if (editMode) {
        editingCode = code;
        document.getElementById('renameTitle').innerText = `Cambiar nombre (Envía "${code}\\n")`;
        document.getElementById('renameInput').value = profiles[currentProfile].labels[code];
        document.getElementById('renameModal').classList.remove('hidden');
        document.getElementById('renameInput').focus();
        return;
      }
      sendCmd(code);
    }

    function saveButtonLabel() {
      const val = document.getElementById('renameInput').value.trim();
      if (val && editingCode) {
        profiles[currentProfile].labels[editingCode] = val;
        document.getElementById('lbl_' + editingCode).innerText = val;
        saveProfilesToStorage();
      }
      closeRenameModal();
    }

    function closeRenameModal() {
      document.getElementById('renameModal').classList.add('hidden');
      editingCode = null;
    }

    function toggleCodeBadges() {
      showBadges = !showBadges;
      document.querySelectorAll('.code-badge').forEach(el => {
        el.classList.toggle('hidden', !showBadges);
      });
      document.getElementById('badgeBtn').innerText = showBadges ? 'Ocultar códigos' : 'Mostrar códigos';
    }

    function logConsole(type, text) {
      const box = document.getElementById('consoleBox');
      const line = document.createElement('div');
      const color = type === 'TX' ? 'text-sky-400' : type === 'RX' ? 'text-emerald-400' : type === 'ERR' ? 'text-rose-400' : 'text-[var(--text-muted)]';
      line.className = color;
      line.innerText = `[${type}] ${text}`;
      box.appendChild(line);
      box.scrollTop = box.scrollHeight;
    }

    function clearConsole() {
      document.getElementById('consoleBox').innerHTML = '';
    }

    initApp();
  </script>
</body>
</html>
